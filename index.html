<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구노트</title>
<style>
:root{
  --bg:#f2f4f8;--panel:#fff;--line:#dfe3ea;--line2:#eceff4;--text:#1d2433;--muted:#6b7488;
  --primary:#2b6cf0;--primary-d:#1f56c4;--primary-l:#e8f0fe;--navy:#1b2a4a;--navy2:#24365d;
  --ok:#12905a;--ok-l:#e6f6ee;--warn:#c47f00;--warn-l:#fff4d9;--bad:#d2304a;--bad-l:#fdecef;
  --add:#e4f6ec;--del:#fdeaed;--chg:#fff5dc;
}
*{box-sizing:border-box}
html{overflow-y:scroll;scrollbar-gutter:stable}
html,body{margin:0;height:100%}
body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:13px;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{font-size:20px;margin:2px 0 0}
small{color:var(--muted)}

/* ---------- ERP shell ---------- */
.topbar{position:sticky;top:0;z-index:50;height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;gap:20px}
.logo,.mods a,.tb-right,.tb-right *{white-space:nowrap}
.logo{font-weight:800;letter-spacing:.5px;font-size:16px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#5b9bff,#2b6cf0);display:inline-block}
.mods{display:flex;gap:2px;height:100%}
.mods a{display:flex;align-items:center;padding:0 14px;color:#b9c4dc;text-decoration:none;font-size:13px;border-bottom:3px solid transparent}
.mods a.on{color:#fff;border-bottom-color:#5b9bff;font-weight:700}
.mods a:hover{color:#fff}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#c9d3ea}
.tb-right select{background:var(--navy2);border:1px solid #3a4e7c;color:#fff;border-radius:6px;padding:5px 8px}
.tb-right label{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.shell{display:flex;align-items:flex-start}
.side{position:sticky;top:52px;width:212px;flex:none;height:calc(100vh - 52px);overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;background:#fff;border-right:1px solid var(--line);padding:10px 0}
.side h4{margin:14px 16px 4px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.side a{display:block;padding:8px 16px 8px 24px;color:#39435a;text-decoration:none;border-left:3px solid transparent;font-size:13px}
.side a:hover{background:#f5f7fb}
.side a.on{background:var(--primary-l);color:var(--primary-d);font-weight:700;border-left-color:var(--primary)}
.tb-right a.tb-link{color:#c9d3ea;text-decoration:none;font-size:inherit;padding:4px 2px}
.tb-right a.tb-link:hover{color:#fff;text-decoration:underline}
.tb-right .tb-link+.tb-link{margin-right:6px}
.main{flex:1;min-width:0;padding:18px 22px 60px}

/* ---------- common ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--primary)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);font-weight:700;flex-wrap:wrap}
.card-h .sp,.sp{flex:1}
.card-b{padding:14px}
.btn{border:1px solid #cbd3e1;background:#fff;border-radius:7px;padding:6px 12px;font-size:12.5px;white-space:nowrap;line-height:1.3}
.btn:hover{background:#f4f6fa}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700;background:#eef0f5;color:#4a5570;white-space:nowrap}
.badge.blue{background:var(--primary-l);color:var(--primary-d)}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.warn{background:var(--warn-l);color:var(--warn)}
.badge.bad{background:var(--bad-l);color:var(--bad)}
.badge.dark{background:#273455;color:#fff}
.tagA{background:#e8f0fe;color:#1f56c4}.tagB{background:#fdeef9;color:#a1318b}.tagL{background:#eee;color:#444}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid #cbd3e1;border-radius:6px;padding:6px 8px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9dbcff;outline-offset:-1px;border-color:var(--primary)}
textarea{resize:vertical;min-height:62px;line-height:1.45}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;margin-bottom:10px;border:1px solid;font-size:12.5px}
.banner b{white-space:nowrap}
.banner.lock{background:#eef1fa;border-color:#c6d0ec;color:#2b3a67}
.banner.info{background:var(--warn-l);border-color:#f1d9a0;color:#7a5200}
.banner.ro{background:#f3f4f7;border-color:var(--line);color:#4a5570}
.toasts{position:fixed;right:20px;bottom:20px;z-index:5000;display:flex;flex-direction:column;gap:8px}
.toast{background:#1d2433;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:12.5px;max-width:380px;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- list ---------- */
.filter .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filter .row:last-child{margin-bottom:0}
.filter .grow{flex:1;min-width:240px}
.filter select{width:auto;min-width:130px}
.filter .ck{display:flex;gap:5px;align-items:center;white-space:nowrap;cursor:pointer}
.filter .ck input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--primary-l);border:1px solid #c6d8fb;border-radius:16px;padding:3px 6px 3px 10px;font-size:12px}
.chip input{width:52px;padding:2px 4px;font-size:12px;text-align:right}
.chip button{border:0;background:transparent;color:#47608f;font-size:15px;line-height:1;padding:0 4px}
.tscroll{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:900px}
@media(max-width:1150px){.side{width:160px}.side a{padding-left:18px}.mods a{padding:0 9px}.main{padding:14px 14px 50px}.topbar{gap:12px}}
table.list th{background:#f6f8fb;text-align:left;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
table.list tr.clickable{cursor:pointer}
table.list tr.clickable:hover td{background:#f7faff}
.ctrl{font-family:Consolas,"D2Coding",monospace;font-size:12px;color:#34406a}
.hit{display:inline-block;background:var(--ok-l);color:var(--ok);border-radius:4px;padding:1px 6px;margin:0 4px 3px 0;font-size:11.5px;font-weight:600}
.res-sum{padding:10px 14px;border-bottom:1px solid var(--line2);color:var(--muted);font-size:12.5px}
.res-sum b{color:var(--text)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* ---------- note ---------- */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 22px}
.info-grid .k{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.info-grid .v{font-weight:600}
.tabs{display:flex;gap:4px;align-items:flex-end;border-bottom:2px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-bottom:0;background:#e9edf4;padding:8px 16px 7px;border-radius:8px 8px 0 0;margin-bottom:-2px;display:flex;align-items:center;gap:7px;font-weight:700;color:#4a5570}
.tab small{font-weight:400}
.tab.on{background:#fff;color:var(--primary-d);border-bottom:2px solid #fff;box-shadow:0 -2px 0 var(--primary) inset}
.tab.add{background:transparent;border-style:dashed;color:var(--primary-d)}
.tab.add:hover{background:var(--primary-l)}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa3b8}
.dot.s-작성중{background:#2b6cf0}.dot.s-견본발송{background:#e0a100}.dot.s-컨펌{background:#12905a}.dot.s-반려{background:#d2304a}.dot.s-종료{background:#9aa3b8}
.split{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(330px,1fr);gap:14px;align-items:start}
@media(max-width:1500px){.split{grid-template-columns:minmax(0,1fr)}}
.split>*{min-width:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}

#grid-wrap{overflow-x:auto}
table.grid{width:100%;min-width:780px;border-collapse:collapse;table-layout:fixed}
table.grid th{background:#f6f8fb;font-size:12px;color:var(--muted);text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
table.grid td{padding:0;border-bottom:1px solid var(--line2);position:relative}
table.grid td.c-n{text-align:center;color:#9aa3b8;font-size:11.5px;width:34px}
table.grid input,table.grid select{border:0;border-radius:0;background:transparent;padding:7px 6px;width:100%;height:32px}
table.grid input:focus,table.grid select:focus{background:#eef4ff;outline:2px solid var(--primary);outline-offset:-2px}
table.grid input.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid td.ro{padding:7px 8px}
table.grid td.ro.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid tr:hover td{background:#fafcff}
table.grid tr.unreg td.c-mat{background:var(--warn-l)}
table.grid tr.unreg td.c-mat::after,table.grid tr.dup td.c-mat::after{position:absolute;right:6px;top:8px;font-size:10.5px;font-weight:700;border-radius:8px;padding:1px 6px;pointer-events:none}
table.grid tr.unreg td.c-mat::after{content:"미등록";background:#f6d98f;color:#7a5200}
table.grid tr.dup td.c-mat::after{content:"중복";background:#f7b9c3;color:#8f1a2e}
table.grid tr.dup td.c-mat{background:var(--bad-l)}
table.grid tr.nopct td.c-p{background:var(--bad-l)}
table.grid input.bad{background:var(--bad-l)}
td.c-dl{padding:0 8px;font-size:12px;white-space:nowrap}
.d{font-weight:700;font-variant-numeric:tabular-nums}
.d.up{color:#c0392b}.d.down{color:#1769c2}.d.add{color:var(--ok)}
td.c-act{width:58px;text-align:center;white-space:nowrap}
td.c-act button{border:0;background:transparent;color:#9aa3b8;font-size:15px;padding:4px 5px;border-radius:4px;visibility:hidden}
tr:hover td.c-act button{visibility:visible}
td.c-act button:hover{background:#e8ebf2;color:var(--bad)}
.hint{padding:8px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line2)}
.hint kbd{background:#eef0f5;border:1px solid #d5dae5;border-radius:4px;padding:0 5px;font-size:11px}
.sum{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:2px solid var(--line);position:sticky;bottom:0;background:#fff;border-radius:0 0 10px 10px;z-index:3}
.sum .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sum.ok .val{color:var(--ok)}.sum.bad .val{color:var(--bad)}
.sum .ph{color:var(--muted);font-size:12px}
.sum .ph b{color:var(--text)}
.issues{padding:0 14px 10px;font-size:12px;color:var(--bad);display:flex;gap:14px;flex-wrap:wrap}
.issues.warn{color:var(--warn)}
.issue{display:inline-flex;gap:4px}
.removed{padding:6px 14px 10px;font-size:12px;color:var(--muted)}
.removed b{color:var(--bad)}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .full{grid-column:1/-1}
.sub-hint{font-size:11.5px;color:var(--muted);margin-top:3px;min-height:14px}
.sub-hint b{color:var(--primary-d)}
.qchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.qchips button{border:1px solid #d5dae5;background:#f6f8fb;border-radius:12px;padding:2px 9px;font-size:11.5px;color:#4a5570}
.qchips button:hover{background:var(--primary-l);border-color:#b8cdf7;color:var(--primary-d)}
.callout{background:#fff9e8;border:1px solid #f0dca4;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.callout b{color:#7a5200}
.timeline{font-size:12.5px;color:#39435a;display:grid;gap:5px;margin-bottom:10px}
.timeline span{color:var(--muted);display:inline-block;width:72px}
.drop{border:2px dashed #c3ccdd;border-radius:8px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;font-size:12.5px}
.drop:hover,.drop.over{background:var(--primary-l);border-color:var(--primary)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.file{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f8f9fc;font-size:11px}
.file .th{height:72px;display:flex;align-items:center;justify-content:center;background:#eef1f7;cursor:pointer;font-weight:800;color:#6a7694;font-size:14px}
.file .th img{width:100%;height:100%;object-fit:cover}
.file .nm{padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .x{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:18px;height:18px;line-height:16px;font-size:12px;padding:0}
.saved{font-weight:400;color:var(--muted);font-size:12px}
.log td{font-size:12.5px}

/* ---------- diff ---------- */
.diff-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px}
.diff-bar select{width:auto}
.dsum{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
table.diff{width:100%;border-collapse:collapse}
table.diff th{background:#f6f8fb;font-size:12px;color:var(--muted);padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
table.diff td{padding:7px 10px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
table.diff td.n{text-align:right}
table.diff td.sg{width:28px;text-align:center;font-weight:800;font-family:Consolas,monospace}
table.diff tr.add td{background:var(--add)}table.diff tr.add td.sg{color:var(--ok)}
table.diff tr.del td{background:var(--del)}table.diff tr.del td.sg{color:var(--bad)}
table.diff tr.chg td{background:var(--chg)}table.diff tr.chg td.sg{color:var(--warn)}
table.diff tr.same td{color:#8b93a7}
table.diff tr.del td.nm span{text-decoration:line-through}
table.diff tr.tot td{font-weight:800;background:#f6f8fb}
.old{color:var(--bad);text-decoration:line-through;margin-right:6px}
.new{color:var(--ok);font-weight:700}
.rtag{display:inline-block;font-weight:700;border-radius:4px;padding:1px 7px;font-size:11.5px}
.rtag.a{background:var(--del);color:var(--bad)}.rtag.b{background:var(--add);color:var(--ok)}

/* ---------- autocomplete ---------- */
.ac{position:fixed;z-index:3000;background:#fff;border:1px solid #b9c5dd;border-radius:8px;box-shadow:0 10px 30px rgba(20,35,70,.2);max-height:320px;overflow:auto;min-width:360px}
.ac-item{padding:7px 12px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ac-item.on,.ac-item:hover{background:var(--primary-l)}
.ac-item b{font-weight:700}
.ac-item .cd{color:#8b93a7;font-size:11px;font-family:Consolas,monospace}
.ac-item em{font-style:normal;color:var(--primary-d);font-size:11px;background:#fff;border:1px solid #c6d8fb;border-radius:8px;padding:0 6px}
.ac-none{padding:10px 12px;color:var(--muted);font-size:12px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,22,40,.45);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:860px}
.m-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2)}
.m-head h3{margin:0;font-size:16px;flex:1}
.m-head .x{border:0;background:transparent;font-size:22px;color:var(--muted);line-height:1}
.m-body{padding:16px 18px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line2);background:#fafbfd;border-radius:0 0 12px 12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.preview{background:#f2f5fb;border:1px dashed #b8c5e2;border-radius:8px;padding:10px 12px;font-size:12.5px}
.preview .ctrl{font-size:15px;font-weight:700}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.opt.on{border-color:var(--primary);background:#f5f9ff}
.opt label.t{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.opt label.t input{width:auto}
.opt .body{margin-top:8px;display:none}
.opt.on .body{display:block}
.check{display:flex;gap:8px;padding:6px 0;font-size:13px}
.check .ic{font-weight:800;width:16px}
.check.ok .ic{color:var(--ok)}.check.bad .ic{color:var(--bad)}.check.warn .ic{color:var(--warn)}
.lb img{max-width:100%;max-height:80vh;display:block;margin:auto}
table.pv{width:100%;border-collapse:collapse;font-size:12.5px}
table.pv th,table.pv td{border-bottom:1px solid var(--line2);padding:5px 8px;text-align:left}
table.pv th{background:#f6f8fb;color:var(--muted)}
.pv-wrap{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.mono{font-family:Consolas,monospace}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><i></i>연구노트</div>
  <nav class="mods">
    <a href="#">홈</a><a href="#">영업</a><a href="#">구매</a><a href="#">생산</a><a href="#" class="on">연구개발</a><a href="#">품질</a><a href="#">시스템</a>
  </nav>
  <div class="tb-right">
    <a class="tb-link" href="erd.html" target="_blank">ERD 보기</a>
    <a class="tb-link" href="#" id="reset-demo">작성한 데이터 초기화</a>
    <span>사용자 전환</span>
    <select id="me-sel"></select>
    <label title="담당자가 휴가 중이면 부담당자가 기록할 수 있습니다"><input type="checkbox" id="leave"> 휴가 중</label>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <h4>연구개발</h4>
    <a href="#" class="on">연구노트</a>
    <a href="#">견본 관리</a>
    <a href="#">처방 승인</a>
    <a href="#">시험 의뢰</a>
    <h4>구매 / 자재</h4>
    <a href="#">원료 마스터</a>
    <a href="#">발주 관리</a>
    <a href="#">입고 검수</a>
    <h4>생산</h4>
    <a href="#">생산 계획</a>
    <a href="#">작업 지시</a>
    <h4>품질</h4>
    <a href="#">시험 성적서</a>
    <a href="#">규격 관리</a>
    <h4>시스템</h4>
    <a href="#">사용자 관리</a>
    <a href="#">권한 관리</a>
  </aside>
  <main class="main"><div id="app"></div></main>
</div>

<div id="ac" class="ac" hidden></div>
<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>

<script>
(function(){
'use strict';

/* =====================================================================
 * 유틸
 * ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);

const decNeed=p=>{const s=String(p);const i=s.indexOf('.');return i<0?0:s.length-i-1};

function parsePct(s){
  s=String(s).trim().replace(/%/g,'').replace(/\s/g,'');
  if(s===''||s==='-')return null;
  if(/^-?\d+,\d+$/.test(s))s=s.replace(',','.');else s=s.replace(/,/g,'');
  const v=Number(s);return isFinite(v)?v:NaN;
}

/* 제품 이니셜: 한글은 초성을 로마자로, 영문/숫자는 그대로 */
const CHO=['G','G','N','D','D','R','M','B','B','S','S','','J','J','C','K','T','P','H'];
const JUNG=['A','A','Y','Y','E','E','Y','Y','O','O','O','O','Y','U','W','W','W','Y','E','E','I'];
function syl(ch){
  const c=ch.charCodeAt(0);
  if(c>=0xAC00&&c<=0xD7A3){const x=c-0xAC00;return CHO[Math.floor(x/588)]||JUNG[Math.floor((x%588)/28)]}
  return /[A-Za-z0-9]/.test(ch)?ch.toUpperCase():'';
}
function prodIni(name){
  const w=String(name).trim().split(/\s+/).filter(Boolean);
  if(!w.length)return '';
  if(w.length>1)return w.map(x=>syl(x[0])).join('').slice(0,6);
  return [...w[0]].map(syl).join('').slice(0,4);
}

function mkRows(items,off){
  let sum=0;const rows=[];
  items.forEach(([k,p,ph,memo])=>{
    const ms=MAT_SEED.find(x=>x[0]===k);sum+=S(p);
    rows.push({id:uid(),matId:ms?k:null,name:ms?'':k,pct:p,phase:ph||'A',dec:Math.min(4,Math.max(ms?ms[4]:2,decNeed(p))),memo:memo||''});
  });
  const w=1e6-sum-Math.round((off||0)*1e4);let d=2;
  while(d<4&&w%Math.pow(10,4-d)!==0)d++;
  rows.unshift({id:uid(),matId:'water',name:'',pct:w/1e4,phase:'A',dec:d,memo:''});
  return rows;
}

const dispName=n=>n.official||n.name;
function canView(n){const m=me();return m.role==='director'||client(n).teamId===m.teamId}
function canEdit(n){const m=me(),o=owner(n),s=subOf(n);return m.id===o.id||(!!s&&m.id===s.id&&o.onLeave)}
function canInfo(n){const m=me(),o=owner(n),s=subOf(n);return m.role==='director'||m.id===o.id||(!!s&&m.id===s.id)}
function revEditable(n,r){return canEdit(n)&&!isLocked(n)&&r===latest(n)}
function noteStatus(n){
  if(isLocked(n))return {t:'컨펌 완료',c:'ok'};
  return latest(n).status==='견본발송'?{t:'컨펌 대기',c:'warn'}:{t:'개발 중',c:'blue'};
}
const rowKey=w=>w.matId?'m:'+w.matId:'n:'+norm(w.name);
const hasRow=w=>!!(w.matId||String(w.name||'').trim());
const rowName=w=>w.matId?matDisp(mat(w.matId)):(w.name||'').trim()+' (미등록)';
const prevRev=(n,r)=>{const i=n.revs.indexOf(r);return i>0?n.revs[i-1]:null};
function sumMap(r){const m=new Map();r.rows.forEach(w=>{if(!hasRow(w))return;const k=rowKey(w);m.set(k,(m.get(k)||0)+S(w.pct))});return m}
function logAdd(n,type,text,extra){n.log.push(Object.assign({id:uid(),at:nowStr(),by:DB.me,type,text},extra||{}))}

/* 원료 검색 / 매칭 */
function matSearch(q,limit=8){
  const nq=norm(q);if(!nq)return [];
  const out=[];
  DB.materials.forEach(m=>{
    let best=0,via='';
    const test=(txt,w,alias)=>{const t=norm(txt);if(!t)return;let s=0;if(t===nq)s=100;else if(t.startsWith(nq))s=70;else if(t.includes(nq))s=40;if(s){s+=w;if(s>best){best=s;via=alias?txt:''}}};
    test(m.trade,6);test(matDisp(m),4);test(m.inci,2);test(m.code,0);
    m.aliases.forEach(a=>test(a,3,true));
    if(best)out.push({m,score:best,via});
  });
  out.sort((a,b)=>b.score-a.score||a.m.trade.localeCompare(b.m.trade));
  return out.slice(0,limit);
}
function resolveExact(t){
  const nt=norm(t);if(!nt)return null;
  const hit=DB.materials.filter(m=>[m.trade,matDisp(m),m.code,...m.aliases].some(x=>norm(x)===nt));
  if(hit.length===1)return hit[0];
  if(hit.length>1)return hit.find(m=>norm(m.trade)===nt||norm(matDisp(m))===nt)||null;
  const byInci=DB.materials.filter(m=>norm(m.inci)===nt);
  return byInci.length===1?byInci[0]:null;
}

/* 합계/점검 */
function calc(r){
  const o={total:0,phases:{},unreg:[],dup:[],nopct:0,neg:0,noname:0,rows:0};
  const seen={};
  r.rows.forEach(w=>{
    const h=hasRow(w);
    if(!h&&w.pct==null)return;
    o.rows++;
    if(!h){o.noname++}
    if(w.pct==null){if(h)o.nopct++}
    else{
      const s=S(w.pct);o.total+=s;
      const ph=(w.phase||'-').trim()||'-';o.phases[ph]=(o.phases[ph]||0)+s;
      if(s<0)o.neg++;
    }
    if(h){
      if(!w.matId)o.unreg.push(w.name);
      const k=rowKey(w);
      if(seen[k]===1){o.dup.push(rowName(w).replace(' (미등록)',''))}
      seen[k]=(seen[k]||0)+1;
    }
  });
  o.dupKeys=Object.keys(seen).filter(k=>seen[k]>1);
  return o;
}

const AC={el:$('#ac'),input:null,items:[],idx:0,open:false,ctx:null};
function acShow(input,ctx){
  const items=matSearch(input.value);
  AC.input=input;AC.ctx=ctx;AC.items=items;AC.idx=0;
  const nq=norm(input.value);
  if(!nq){acHide();return}
  AC.el.innerHTML=items.length?items.map((x,i)=>`<div class="ac-item ${i===0?'on':''}" data-i="${i}"><b>${esc(x.m.trade)}</b><span>(${esc(x.m.inci)})</span><span class="cd">${esc(x.m.code)}</span>${x.via?`<em>별칭: ${esc(x.via)}</em>`:''}</div>`).join('')
    :`<div class="ac-none">일치하는 원료가 없습니다. 입력한 이름 그대로 두면 <b>미등록 원료</b>로 표시됩니다.</div>`;
  const r=input.getBoundingClientRect();
  AC.el.hidden=false;
  AC.el.style.left=Math.min(r.left,window.innerWidth-380)+'px';
  AC.el.style.top=(r.bottom+2)+'px';
  AC.el.style.minWidth=Math.max(r.width,360)+'px';
  AC.open=items.length>0;
}
function acHide(){AC.el.hidden=true;AC.open=false;AC.items=[];}
function acMove(d){
  if(!AC.items.length)return;
  AC.idx=(AC.idx+d+AC.items.length)%AC.items.length;
  $$('.ac-item',AC.el).forEach((e,i)=>e.classList.toggle('on',i===AC.idx));
  const on=$('.ac-item.on',AC.el);if(on)on.scrollIntoView({block:'nearest'});
}
function acPick(i){
  const it=AC.items[i==null?AC.idx:i];if(!it)return false;
  const ctx=AC.ctx,input=AC.input;
  acHide();
  if(ctx.type==='row'){
    const {r}=cur();const row=r.rows.find(w=>w.id===ctx.rowId);
    if(row)applyMat(row,it.m,input);
    focusCell(ctx.rowId,'pct');
  }else if(ctx.type==='filter'){
    ui.filt.mats.push({matId:it.m.id,min:'',max:''});
    input.value='';renderMatChips();updateResults();input.focus();
  }
  return true;
}
AC.el.addEventListener('mousedown',e=>{
  const it=e.target.closest('.ac-item');if(!it)return;
  e.preventDefault();acPick(+it.dataset.i);
});
window.addEventListener('scroll',()=>{if(!AC.el.hidden)acHide()},true);

function renderMatChips(){

    <button data-act="chip-del" data-i="${i}" title="제거">×</button></span>`).join('');
}
function searchNotes(){
  const f=ui.filt,toks=f.text.split(/\s+/).filter(Boolean).map(norm);
  const m=me();
  const out=[];
  DB.notes.filter(canView).forEach(n=>{
    if(f.client&&n.clientId!==f.client)return;
    if(f.status&&noteStatus(n).t!==f.status)return;
    if(f.mine&&![owner(n).id,(subOf(n)||{}).id].includes(m.id))return;
    if(toks.length){
      const hay=norm([n.ctrl,n.name,n.official,client(n).name,owner(n).name,(subOf(n)||{}).name||'',
        ...n.revs.flatMap(r=>[r.comment,r.next,r.appearance,r.odor,...r.rows.map(rowName),...r.rows.flatMap(w=>w.matId?mat(w.matId).aliases:[])])].join(' '));
      if(!toks.every(t=>hay.includes(t)))return;
    }
    let hits=[];
    if(f.mats.length){
      const revs=f.all?n.revs:[latest(n)];
      revs.forEach(r=>{
        const sm=sumMap(r);const vals=[];let okAll=true;
        for(const c of f.mats){
          const v=sm.get('m:'+c.matId);
          const mn=c.min===''?null:parsePct(c.min),mx=c.max===''?null:parsePct(c.max);
          if(v===undefined||(mn!=null&&!isNaN(mn)&&v<S(mn))||(mx!=null&&!isNaN(mx)&&v>S(mx))){okAll=false;break}
          vals.push({m:mat(c.matId),v});
        }
        if(okAll)hits.push({r,vals});
      });
      if(!hits.length)return;
    }
    out.push({n,hits});
  });
  out.sort((a,b)=>b.n.start.localeCompare(a.n.start));
  return out;
}
function updateResults(){
  const box=$('#results');if(!box)return;
  const res=searchNotes(),f=ui.filt;

    }

  box.innerHTML=`<div class="card">
    <div class="res-sum"><b>${res.length}</b>건${sum}${me().role==='director'?'':` · <span>${esc(teamName(me().teamId))} 거래처 노트만 표시됩니다</span>`}</div>
    ${res.length?`<div class="tscroll"><table class="list"><thead><tr><th>관리번호</th><th>제품명</th><th>거래처</th><th>담당자 / 부담당자</th><th>시작일</th><th>진행</th><th>상태</th>${showHits?'<th>원료 일치 처방</th>':''}<th>최종 수정</th></tr></thead><tbody>
    ${res.map(({n,hits})=>{

        <td>${esc(client(n).name)} ${teamBadge(client(n).teamId)}</td>
        <td>${esc(o.name)}${o.onLeave?' <span class="badge warn">휴가</span>':''}${s?`<div><small>${esc(s.name)}</small></div>`:''}</td>
        <td>${n.start}</td>
        <td>${n.revs.length}차 <small>(${L.status})</small></td>
        <td><span class="badge ${st.c}">${st.t}</span></td>
        ${showHits?`<td>${hits.slice(0,4).map(h=>`<span class="hit">${h.r.no}차 · ${h.vals.map(v=>`${esc(v.m.trade)} ${fmtP(v.v)}%`).join(' / ')}</span>`).join('')}${hits.length>4?`<small>외 ${hits.length-4}</small>`:''}</td>`:''}
        <td><small>${esc(L.editedAt)}</small></td></tr>`}).join('')}
    </tbody></table></div>`:'<div class="empty">조건에 맞는 연구노트가 없습니다.</div>'}
  </div>`;
}

function gridHtml(n,r,ed){
  const hasPrev=!!prevRev(n,r);
  return `<table class="grid" id="grid"><colgroup><col style="width:34px"><col style="width:54px"><col><col style="width:104px">${hasPrev?'<col style="width:92px">':''}<col style="width:120px">${ed?'<col style="width:58px">':''}</colgroup>
  <thead><tr><th style="text-align:center">#</th><th>상</th><th>원료 <small>상품명(성분명)</small></th><th style="text-align:right">함량(%)</th>${hasPrev?'<th>전 차수 대비</th>':''}<th>비고</th>${ed?'<th></th>':''}</tr></thead>
  <tbody id="grid-body">${r.rows.map((w,i)=>rowHtml(w,i,ed,hasPrev)).join('')}</tbody></table>`;
}
function rowHtml(w,i,ed,hasPrev){
  const m=mat(w.matId),val=m?matDisp(m):w.name;
  if(!ed){
    return `<tr data-row="${w.id}"><td class="c-n">${i+1}</td><td class="ro">${esc(w.phase)}</td><td class="ro c-mat">${esc(val)}</td><td class="ro num">${w.pct==null?'':fmt(w.pct,w.dec)}</td>${hasPrev?'<td class="c-dl"></td>':''}<td class="ro">${esc(w.memo)}</td></tr>`;
  }
  return `<tr data-row="${w.id}"><td class="c-n">${i+1}</td>
    <td><input data-f="phase" value="${esc(w.phase)}" maxlength="4" autocomplete="off"></td>
    <td class="c-mat"><input data-f="mat" value="${esc(val)}" placeholder="원료명 입력 (상품명 · 성분명 · 내가 부르는 이름)" autocomplete="off" spellcheck="false"></td>
    <td class="c-p"><input data-f="pct" class="num" value="${w.pct==null?'':fmt(w.pct,w.dec)}" inputmode="decimal" autocomplete="off"></td>
    ${hasPrev?'<td class="c-dl"></td>':''}
    <td><input data-f="memo" value="${esc(w.memo)}" autocomplete="off"></td>
    <td class="c-act"><button data-act="row-ins" title="아래에 행 삽입 (Ctrl+Enter)">+</button><button data-act="row-del" title="행 삭제">×</button></td></tr>`;
}

/* 합계·점검·전 차수 대비를 실시간 갱신 (그리드는 다시 그리지 않음) */
function updateSum(){
  const {n,r}=cur();const box=$('#sum-panel');if(!n||!box)return;
  const c=calc(r),ok=c.total===1e6,ed=revEditable(n,r);
  const diffv=c.total-1e6;
  const prev=prevRev(n,r);
  const pm=prev?sumMap(prev):null;
  $$('#grid-body tr').forEach(tr=>{
    const w=r.rows.find(x=>x.id===tr.dataset.row);if(!w)return;
    const h=hasRow(w);
    tr.classList.toggle('unreg',h&&!w.matId);
    tr.classList.toggle('dup',h&&c.dupKeys.includes(rowKey(w)));
    tr.classList.toggle('nopct',h&&w.pct==null);
    const dl=$('.c-dl',tr);
    if(dl&&pm){
      let html='';
      if(h){
        const a=pm.get(rowKey(w));
        if(a===undefined)html='<span class="d add">신규</span>';
        else{const d=S(w.pct)-a;if(d)html=`<span class="d ${d>0?'up':'down'}">${d>0?'+':'-'}${fmtP(Math.abs(d))}</span>`}
      }
      dl.innerHTML=html;
    }
  });
  let removed='';
  if(pm){
    const now=sumMap(r);
    const gone=[...pm.keys()].filter(k=>!now.has(k)).map(k=>{
      const w=prev.rows.find(x=>rowKey(x)===k);return esc(rowName(w).replace(' (미등록)',''))});
    if(gone.length)removed=`<div class="removed"><b>삭제됨</b> (${prev.no}차 대비): ${gone.join(', ')}</div>`;
  }
  const issues=[];
  if(!ok&&c.rows)issues.push(`합계가 100%가 아닙니다 (${diffv<0?fmtP(-diffv)+'% 부족':fmtP(diffv)+'% 초과'})`);
  if(c.nopct)issues.push(`함량이 비어 있는 원료 ${c.nopct}건`);
  if(c.noname)issues.push(`원료명 없이 함량만 입력된 행 ${c.noname}건`);
  if(c.dup.length)issues.push(`중복 원료: ${esc([...new Set(c.dup)].join(', '))}`);
  if(c.neg)issues.push('음수 함량이 있습니다');
  const warns=[];
  if(c.unreg.length)warns.push(`구매팀 미등록 원료 ${c.unreg.length}건: ${esc(c.unreg.join(', '))}`);
  const phases=Object.keys(c.phases).sort().map(k=>`<b>${esc(k)}</b> ${fmtP(c.phases[k])}`).join(' &nbsp;·&nbsp; ');
  box.innerHTML=`<div class="sum ${ok?'ok':'bad'}">
      <div><small>합계</small><div><span class="val">${fmtP(c.total)}</span> %</div></div>
      <div>${ok?'<span class="badge ok">✓ 100% 일치</span>':c.rows?`<span class="badge bad">${diffv<0?'▼ '+fmtP(-diffv)+'% 부족':'▲ '+fmtP(diffv)+'% 초과'}</span>`:''}</div>
      <div class="ph">${phases?'상별 소계 · '+phases:''}</div>
      <span class="sp"></span>
      ${ed&&!ok&&c.rows?'<button class="btn sm primary" data-act="balance">정제수로 합계 맞추기</button>':''}
    </div>
    ${issues.length?`<div class="issues">${issues.map(t=>`<span class="issue">● ${t}</span>`).join('')}</div>`:''}
    ${warns.length?`<div class="issues warn">${warns.map(t=>`<span class="issue">▲ ${t}</span>`).join('')}</div>`:''}
    ${removed}`;
}

      ${prev.next?`<div style="margin-top:4px"><small>다음 차수에서 바꿀 것</small><br>${esc(prev.next).replace(/\n/g,'<br>')}</div>`:''}</div>`:''}
    <div class="kv">
      <div><label class="f">점도 (cP)</label><input type="text" data-rf="viscosity" value="${esc(r.viscosity)}" ${rd} inputmode="decimal" autocomplete="off"><div class="sub-hint" id="hint-viscosity"></div></div>
      <div><label class="f">pH</label><input type="text" data-rf="ph" value="${esc(r.ph)}" ${rd} inputmode="decimal" autocomplete="off"><div class="sub-hint" id="hint-ph"></div></div>
      <div><label class="f">성상 / 색상</label><input type="text" data-rf="appearance" value="${esc(r.appearance)}" ${rd} autocomplete="off"></div>

function updateHints(){
  const {n,r}=cur();if(!n)return;const p=prevRev(n,r);
  ['viscosity','ph'].forEach(k=>{
    const el=$('#hint-'+k);if(!el)return;
    if(!p||!String(p[k]).trim()){el.textContent='';return}
    const a=parseFloat(String(p[k]).replace(/[^\d.\-]/g,'')),b=parseFloat(String(r[k]).replace(/[^\d.\-]/g,''));

}
function logHtml(n){

/* =====================================================================
 * 차수 비교 (diff)
 * ===================================================================== */
function diffRows(A,B){
  const agg=r=>{const m=new Map();r.rows.forEach(w=>{if(!hasRow(w))return;const k=rowKey(w);const o=m.get(k)||{key:k,name:rowName(w),phase:w.phase,pct:0,dec:w.dec};o.pct+=S(w.pct);m.set(k,o)});return m};
  const a=agg(A),b=agg(B),out=[];
  for(const [k,o] of b){
    const p=a.get(k);
    out.push({key:k,name:o.name,pa:p?p.pct:null,pb:o.pct,phA:p?p.phase:null,phB:o.phase,
      st:!p?'add':(p.pct!==o.pct||p.phase!==o.phase?'chg':'same')});
  }
  let last=null;
  for(const [k,p] of a){
    if(b.has(k)){last=k;continue}
    const idx=last==null?0:out.findIndex(x=>x.key===last)+1;
    out.splice(idx,0,{key:k,name:p.name,pa:p.pct,pb:null,phA:p.phase,phB:null,st:'del'});
    last=k;
  }
  return out;
}
function diffHtml(n){
  const A=n.revs.find(r=>r.id===ui.diffA),B=n.revs.find(r=>r.id===ui.diffB);
  if(!A||!B)return '<div class="card"><div class="empty">비교할 차수를 선택하세요.</div></div>';
  const rows=diffRows(A,B);
  const cnt={add:0,del:0,chg:0,same:0};rows.forEach(x=>cnt[x.st]++);
  const tA=calc(A).total,tB=calc(B).total;
  const opt=(sel)=>n.revs.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${r.no}차 (${r.status})</option>`).join('');
  const show=rows.filter(x=>!ui.diffHide||x.st!=='same');
  const sg={add:'+',del:'−',chg:'~',same:''};
  const fld=[['viscosity','점도 (cP)'],['ph','pH'],['appearance','성상 / 색상'],['odor','향'],['comment','결과 메모'],['next','다음에 바꿀 것']];
  return `<div class="card">
    <div class="diff-bar"><b>비교</b>
      <span class="rtag a">기준</span><select id="d-a">${opt(A.id)}</select>
      <button class="btn sm" data-act="diff-swap" title="기준과 대상 바꾸기">⇄</button>
      <span class="rtag b">대상</span><select id="d-b">${opt(B.id)}</select>
      <span class="sp"></span>
      <label class="ck" style="display:flex;gap:5px;align-items:center;cursor:pointer"><input type="checkbox" id="d-hide" ${ui.diffHide?'checked':''} style="width:auto"> 변경 없는 원료 숨기기</label>
    </div>
    <div class="dsum"><span class="badge ok">추가 ${cnt.add}</span><span class="badge bad">삭제 ${cnt.del}</span><span class="badge warn">변경 ${cnt.chg}</span><span class="badge">동일 ${cnt.same}</span>
      <span class="badge ${tA===tB?'':'blue'}">합계 ${fmtP(tA)}% → ${fmtP(tB)}%</span></div>
    <table class="diff"><thead><tr><th></th><th>상</th><th>원료</th><th style="text-align:right">${A.no}차 (%)</th><th style="text-align:right">${B.no}차 (%)</th><th style="text-align:right">증감</th></tr></thead><tbody>
    ${show.map(x=>{
      const d=(x.pa==null?0:-x.pa)+(x.pb==null?0:x.pb);
      const ph=x.phA&&x.phB&&x.phA!==x.phB?`<span class="old">${esc(x.phA)}</span><span class="new">${esc(x.phB)}</span>`:esc(x.phB||x.phA||'');
      return `<tr class="${x.st}"><td class="sg">${sg[x.st]}</td><td>${ph}</td><td class="nm"><span>${esc(x.name)}</span></td>
        <td class="n">${x.pa==null?'':fmtP(x.pa)}</td><td class="n">${x.pb==null?'':(x.st==='chg'?`<b>${fmtP(x.pb)}</b>`:fmtP(x.pb))}</td>
        <td class="n">${x.st==='same'?'':(x.st==='add'?'<span class="d add">신규 '+fmtP(x.pb)+'</span>':x.st==='del'?'<span class="d up">삭제 -'+fmtP(x.pa)+'</span>':(d?`<span class="d ${d>0?'up':'down'}">${d>0?'+':'-'}${fmtP(Math.abs(d))}</span>`:'상 변경'))}</td></tr>`}).join('')}
    ${!show.length?'<tr><td colspan="6" class="empty">두 차수의 처방이 동일합니다.</td></tr>':''}
    <tr class="tot"><td></td><td></td><td>합계</td><td class="n">${fmtP(tA)}</td><td class="n">${fmtP(tB)}</td><td class="n">${tA===tB?'':(tB-tA>0?'+':'-')+fmtP(Math.abs(tB-tA))}</td></tr>
    </tbody></table>
  </div>
  <div class="card"><div class="card-h">결과 · 메모 비교</div>
    <table class="diff"><thead><tr><th></th><th style="width:140px">항목</th><th>${A.no}차</th><th>${B.no}차</th></tr></thead><tbody>
    ${fld.map(([k,l])=>{const a=String(A[k]||''),b=String(B[k]||''),ch=a!==b;
      return `<tr class="${ch?'chg':'same'}"><td class="sg">${ch?'~':''}</td><td>${l}</td><td style="white-space:pre-wrap">${esc(a)||'<small>-</small>'}</td><td style="white-space:pre-wrap">${ch?`<span class="new">${esc(b)||'<small>-</small>'}</span>`:esc(b)||'<small>-</small>'}</td></tr>`}).join('')}
    </tbody></table></div>`;
}

/* =====================================================================
 * 그리드 편집 로직
 * ===================================================================== */
let editTimer=null;
function touch(){
  const {n,r}=cur();if(!n)return;
  const o=owner(n);
  r.editedBy=DB.me;r.editedAt=nowStr();r.byProxy=DB.me!==o.id;
  const el=$('#saved');if(el)el.textContent='저장 중…';
  clearTimeout(editTimer);
  editTimer=setTimeout(()=>{persist();const e=$('#saved');if(e)e.textContent='자동 저장됨 '+r.editedAt.slice(11)},350);
}
function focusCell(rowId,field,sel=true){
  const el=$(`#grid tr[data-row="${rowId}"] [data-f="${field}"]`);
  if(el){el.focus();if(sel&&el.select)el.select()}
}
function newRow(phase){return {id:uid(),matId:null,name:'',pct:null,phase:phase||'A',dec:2,memo:''}}
function refreshGrid(){
  const {n,r}=cur();const ed=revEditable(n,r);
  $('#grid-wrap').innerHTML=gridHtml(n,r,ed);updateSum();
}
function addRowAfter(idx,focus=true){
  const {r}=cur();
  const ph=idx>=0&&r.rows[idx]?r.rows[idx].phase:(r.rows.length?r.rows[r.rows.length-1].phase:'A');
  const w=newRow(ph);r.rows.splice(idx+1,0,w);refreshGrid();
  if(focus)focusCell(w.id,'mat');
  touch();return w;
}
function applyMat(row,m,input){
  row.matId=m.id;row.name='';
  row.dec=Math.min(4,Math.max(m.dec,row.pct==null?0:decNeed(row.pct)));
  if(input)input.value=matDisp(m);
  const tr=$(`#grid tr[data-row="${row.id}"]`);
  if(tr){
    const p=$('[data-f="pct"]',tr);
    if(p&&row.pct!=null)p.value=fmt(row.pct,row.dec);
  }
  updateSum();touch();
}
function gridInput(t){
  const {r}=cur();const tr=t.closest('tr[data-row]');if(!tr)return;
  const row=r.rows.find(w=>w.id===tr.dataset.row);if(!row)return;
  const f=t.dataset.f;
  if(f==='mat'){
    row.matId=null;row.name=t.value;
    updateSum();touch();acShow(t,{type:'row',rowId:row.id});
  }else if(f==='pct'){
    const v=parsePct(t.value);
    t.classList.toggle('bad',v!=null&&isNaN(v));
    row.pct=(v==null||isNaN(v))?null:Math.round(v*1e4)/1e4;
    updateSum();touch();
  }else if(f==='phase'){row.phase=t.value.toUpperCase();t.value=row.phase;updateSum();touch()}
  else if(f==='memo'){row.memo=t.value;touch()}
}
function gridKey(e,t){
  const f=t.dataset.f,tr=t.closest('tr[data-row]');
  const {r}=cur();const id=tr.dataset.row;const i=r.rows.findIndex(w=>w.id===id);
  if(f==='mat'&&!AC.el.hidden){
    if(e.key==='ArrowDown'){e.preventDefault();return acMove(1)}
    if(e.key==='ArrowUp'){e.preventDefault();return acMove(-1)}
    if(e.key==='Enter'||e.key==='Tab'){
      if(AC.items.length&&AC.input===t&&!e.shiftKey){e.preventDefault();return acPick()}
    }
  }
  if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();addRowAfter(i);return}
  if(e.key==='Enter'&&!e.isComposing){
    e.preventDefault();
    if(f==='phase')return focusCell(id,'mat');
    if(f==='mat')return focusCell(id,'pct');
    const next=r.rows[i+1];
    if(next)return focusCell(next.id,'mat');

    const j=i+(e.key==='ArrowDown'?1:-1);
    if(r.rows[j]){e.preventDefault();focusCell(r.rows[j].id,f)}
  }

function gridFocusOut(t){

function rowFromParsed(x,defPhase){
  const m=resolveExact(x.name);

function csvSplit(line){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){out.push(cur);cur=''}else cur+=c;
  }
  out.push(cur);return out;
}
function parseTable(text){
  let lines=text.replace(/\r/g,'').split('\n');
  while(lines.length&&!lines[lines.length-1].trim())lines.pop();
  while(lines.length&&!lines[0].trim())lines.shift();
  if(!lines.length)return [];
  const isNum=s=>/^-?\d+([.,]\d+)?\s*%?$/.test(String(s).trim());
  let cells;
  if(lines.some(l=>l.includes('\t')))cells=lines.map(l=>l.split('\t').map(c=>c.trim().replace(/^"(.*)"$/,'$1')));
  else cells=lines.map(l=>{
    const mm=l.trim().match(/^(.*\S)\s+(-?[\d.,]+)\s*%?$/);
    return mm?[mm[1],mm[2]]:[l.trim()];
  });
  const W=Math.max(...cells.map(c=>c.length));
  const map={name:-1,pct:-1,phase:-1,memo:-1};
  let start=0;
  const head=cells[0];
  const keys=head.map(h=>{
    if(/원료|성분|품명|명칭|name|material|ingredient/i.test(h))return 'name';
    if(/함량|%|wt|비율|양/i.test(h))return 'pct';
    if(/^(상|phase|구분|part)$/i.test(h.trim()))return 'phase';
    if(/비고|메모|note|remark/i.test(h))return 'memo';
    return '';
  });
  if((keys.includes('name')||keys.includes('pct'))&&!head.some(isNum)){
    keys.forEach((k,i)=>{if(k&&map[k]<0)map[k]=i});start=1;
  }else{
    const stat=[];
    for(let j=0;j<W;j++){
      const col=cells.map(c=>(c[j]||'').trim()).filter(Boolean);
      stat.push({num:col.length?col.filter(isNum).length/col.length:0,len:col.length?Math.max(...col.map(s=>s.length)):0,n:col.length});
    }
    map.name=stat.findIndex(s=>s.n&&s.num<.3&&s.len>3);
    if(map.name<0)map.name=stat.findIndex(s=>s.n&&s.num<.3);
    map.pct=stat.findIndex((s,j)=>j>map.name&&s.n&&s.num>=.7);
    if(map.pct<0)map.pct=stat.findIndex((s,j)=>j!==map.name&&s.n&&s.num>=.7&&j>0);
    const ph=stat.findIndex((s,j)=>j<map.name&&s.n&&s.num<.3&&s.len<=3);
    if(ph>=0)map.phase=ph;
    map.memo=stat.findIndex((s,j)=>j>Math.max(map.name,map.pct)&&s.n&&s.num<.3);
  }
  if(map.name<0)return [];
  const out=[];
  for(let i=start;i<cells.length;i++){
    const c=cells[i];
    const name=(c[map.name]||'').trim();
    const pctText=map.pct>=0?(c[map.pct]||'').trim():'';
    if(!name&&!pctText)continue;
    if(/^(합계|총계|total|sum)$/i.test(name))continue;
    out.push({name,pct:parsePct(pctText),pctText,phase:map.phase>=0?(c[map.phase]||'').trim():'',memo:map.memo>=0?(c[map.memo]||'').trim():''});
  }
  return out;
}

}
function nnClient(){
  const cid=$('#nn-client').value,cl=DB.clients.find(c=>c.id===cid);
  const team=DB.users.filter(u=>u.role!=='director'&&u.teamId===cl.teamId);
  const m=me();
  const def=team.find(u=>u.id===m.id)||team[0];
  $('#nn-owner').innerHTML=team.map(u=>`<option value="${u.id}" ${def&&u.id===def.id?'selected':''}>${esc(u.name)}</option>`).join('');
  const sub=team.find(u=>def&&u.id!==def.id);
  $('#nn-sub').innerHTML='<option value="">지정 없음</option>'+team.map(u=>`<option value="${u.id}" ${sub&&u.id===sub.id?'selected':''}>${esc(u.name)}</option>`).join('');
  nnUpdate();
}
function nnCtrl(){
  const st=$('#nn-start').value||todayStr(),ow=userBy($('#nn-owner').value);
  let base=`${st.replace(/-/g,'')}-${$('#nn-ini').value.trim().toUpperCase()||'?'}-${ow?ow.ini:'?'}`,c=base,i=2;
  while(DB.notes.some(n=>n.ctrl===c))c=`${base}-${i++}`;
  return c;
}
function nnUpdate(){const el=$('#nn-ctrl');if(el)el.textContent=nnCtrl()}
function createNote(){
  const name=$('#nn-name').value.trim(),ini=$('#nn-ini').value.trim();
  if(!name)return toast('제품명을 입력하세요.');
  if(!ini)return toast('제품 이니셜을 입력하세요.');
  const ow=$('#nn-owner').value,sb=$('#nn-sub').value;
  if(ow===sb&&sb)return toast('담당자와 부담당자가 같을 수 없습니다.');
  const rows=[Object.assign(newRow('A'),{matId:'water',dec:2}),newRow('A'),newRow('A')];
  const n={id:uid(),ctrl:nnCtrl(),name,official:'',clientId:$('#nn-client').value,start:$('#nn-start').value||todayStr(),
    members:[{userId:ow,role:'owner'}].concat(sb?[{userId:sb,role:'sub'}]:[]),
    revs:[{id:uid(),no:1,status:'작성중',sent:null,confirmed:null,confirmRemark:'',rows,viscosity:'',ph:'',appearance:'',odor:'',comment:'',next:'',files:[],editedBy:DB.me,editedAt:nowStr(),byProxy:false,createdAt:nowStr(),copiedFrom:null}],
    log:[]};
  logAdd(n,'create','연구노트 생성');
  DB.notes.push(n);persist();closeModal();
  ui.view='note';ui.noteId=n.id;ui.revId=n.revs[0].id;ui.mode='edit';render();
  setTimeout(()=>focusCell(rows[1].id,'mat'),30);
  toast(`${n.ctrl} 노트를 만들었습니다`);
}

/* ---------- 첨부 ---------- */
function addFiles(files){
  const {n,r}=cur();if(!n||!revEditable(n,r))return;
  [...files].forEach(f=>{
    if(f.size>10*1024*1024)return toast(`${f.name}: 10MB를 넘어 첨부할 수 없습니다`);
    const rd=new FileReader();
    rd.onload=()=>{
      r.files.push({id:uid(),name:f.name||('붙여넣은 이미지_'+Date.now()+'.png'),type:f.type,size:f.size,data:rd.result,by:DB.me,at:nowStr()});
      touch();persist();const b=$('#files');if(b)b.innerHTML=filesHtml(r,true);
    };
    rd.readAsDataURL(f);
  });
}

/* =====================================================================
 * 이벤트 위임
 * ===================================================================== */
const ACTIONS={
  'open-note'(t){ui.view='note';ui.noteId=t.dataset.id;const n=note();ui.revId=latest(n).id;ui.mode='edit';render();window.scrollTo(0,0)},
  'back-list'(){ui.view='list';render()},
  'new-note'(){openNewNote()},
  'nn-create'(){createNote()},
  'modal-close'(){closeModal()},
  'tab'(t){ui.revId=t.dataset.id;ui.mode='edit';render()},
  'new-rev'(){newRevision()},
  'diff-toggle'(){
    const {n,r}=cur();
    if(ui.mode==='diff'){ui.mode='edit'}
    else{
      ui.mode='diff';
      const i=n.revs.indexOf(r);
      if(i>0){ui.diffA=n.revs[i-1].id;ui.diffB=r.id}
      else{ui.diffA=r.id;ui.diffB=n.revs[1].id}
    }
    render();
  },
  'diff-swap'(){[ui.diffA,ui.diffB]=[ui.diffB,ui.diffA];render()},
  'row-add'(){const {r}=cur();addRowAfter(r.rows.length-1)},
  'row-ins'(t){const {r}=cur();const id=t.closest('tr').dataset.row;addRowAfter(r.rows.findIndex(w=>w.id===id))},
  'row-del'(t){
    const {r}=cur();const id=t.closest('tr').dataset.row;
    r.rows=r.rows.filter(w=>w.id!==id);if(!r.rows.length)r.rows.push(newRow('A'));
    refreshGrid();touch();
  },
  'balance'(){balanceWater()},
  'import'(){openImport()},
  'import-apply'(){importApply()},
  'send'(){const {n,r}=cur();r.status='견본발송';r.sent=todayStr();logAdd(n,'sent',`${r.no}차 견본 발송`);persist();render();toast('견본 발송 처리했습니다. 거래처 컨펌이 나면 컨펌 완료를 눌러주세요.')},
  'confirm'(){openConfirm()},
  'confirm-do'(){confirmDo()},
  'info'(t,e){e.preventDefault();if(canInfo(note()))openInfo()},
  'info-save'(){saveInfo()},
  'chip'(t){
    const {r}=cur();const f=t.dataset.f,tx=t.dataset.t;
    const cur_=r[f]||'';if(cur_.split(/[,\n]\s*/).includes(tx))return;
    r[f]=cur_?(cur_.replace(/[\s,]+$/,'')+', '+tx):tx;
    const el=$(`[data-rf="${f}"]`);el.value=r[f];el.focus();touch();
  },
  'file-del'(t){const {r}=cur();r.files=r.files.filter(f=>f.id!==t.dataset.id);touch();persist();$('#files').innerHTML=filesHtml(r,true)},
  'file-open'(t){
    const {r}=cur();const f=r.files.find(x=>x.id===t.dataset.id);if(!f)return;
    if(/^image\//.test(f.type)&&f.data){openModal(esc(f.name),`<div class="lb"><img src="${f.data}" alt=""></div>`,'',{wide:true,nofocus:true})}
    else if(f.data){download(new Blob([Uint8Array.from(atob(f.data.split(',')[1]),c=>c.charCodeAt(0))],{type:f.type}),f.name)}
    else toast('데모에서는 이 파일의 내용이 저장되어 있지 않습니다.');
  },
  'attach-pick'(){$('#file-in').click()},
  'copy-ctrl'(){const {n}=cur();(navigator.clipboard?navigator.clipboard.writeText(n.ctrl):Promise.reject()).then(()=>toast('관리번호를 복사했습니다'),()=>toast(n.ctrl))},
  'chip-del'(t){ui.filt.mats.splice(+t.dataset.i,1);renderMatChips();updateResults()},
  'filt-reset'(){ui.filt={text:'',mats:[],client:'',status:'',mine:false,all:true};renderList()},
  'toggle-log'(){ui.logOpen=!ui.logOpen;render()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const fn=ACTIONS[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#grid')&&t.dataset.f)return gridInput(t);
  if(t.dataset.rf){const {r}=cur();r[t.dataset.rf]=t.value;touch();if(t.dataset.rf==='viscosity'||t.dataset.rf==='ph')updateHints();return}
  if(t.id==='f-text'){ui.filt.text=t.value;return updateResults()}
  if(t.id==='f-mat'){return acShow(t,{type:'filter'})}
  if(t.dataset.chip!==undefined){ui.filt.mats[+t.dataset.chip][t.dataset.k]=t.value;return updateResults()}
  if(t.id==='im-text')return importPreview();
  if(t.id==='nn-name'){const ini=$('#nn-ini');if(!ini.dataset.touched)ini.value=prodIni(t.value);return nnUpdate()}
  if(t.id==='nn-ini'){t.dataset.touched='1';return nnUpdate()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-client'){ui.filt.client=t.value;updateResults()}
  else if(t.id==='f-status'){ui.filt.status=t.value;updateResults()}
  else if(t.id==='f-mine'){ui.filt.mine=t.checked;updateResults()}
  else if(t.id==='f-all'){ui.filt.all=t.checked;updateResults()}
  else if(t.id==='d-a'){ui.diffA=t.value;render()}
  else if(t.id==='d-b'){ui.diffB=t.value;render()}
  else if(t.id==='d-hide'){ui.diffHide=t.checked;render()}
  else if(t.id==='nn-client')nnClient();
  else if(t.id==='nn-owner'||t.id==='nn-start')nnUpdate();
  else if(t.id==='file-in'){addFiles(t.files);t.value=''}
  else if(t.id==='im-file'){
    const f=t.files[0];if(!f)return;
    const ext=f.name.split('.').pop().toLowerCase();
    const put=txt=>{$('#im-text').value=txt;importPreview()};
    if(ext==='xlsx'||ext==='xls'){
      loadXLSX().then(async X=>{
        const wb=X.read(await f.arrayBuffer(),{type:'array'});
        put(X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{FS:'\t',RS:'\n'}));
      }).catch(()=>toast('xlsx 파일은 인터넷 연결이 필요합니다. 엑셀에서 CSV로 저장하거나, 셀을 복사해 붙여넣어 주세요.',6000));
    }else{
      const rd=new FileReader();
      rd.onload=()=>{const tx=String(rd.result).replace(/^\ufeff/,'');put(ext==='csv'?tx.replace(/\r/g,'').split('\n').map(l=>csvSplit(l).join('\t')).join('\n'):tx)};
      rd.readAsText(f,'utf-8');
    }
  }
  else if(t.id==='me-sel'){DB.me=t.value;persist();setupTopbar();render()}
  else if(t.id==='leave'){me().onLeave=t.checked;persist();render();toast(t.checked?`${me().name}님을 휴가 중으로 표시했습니다. 부담당자가 대리 기록할 수 있습니다.`:'휴가 표시를 해제했습니다.')}
  else if(t.dataset.ie){const o=t.closest('.opt');o.classList.toggle('on',t.checked)}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#grid')&&t.dataset.f)return gridKey(e,t);
  if(t.id==='f-mat'&&!AC.el.hidden){
    if(e.key==='ArrowDown'){e.preventDefault();acMove(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();acMove(-1)}
    else if(e.key==='Enter'||e.key==='Tab'){if(AC.items.length){e.preventDefault();acPick()}}
  }
  if(e.key==='Enter'&&t.tagName==='INPUT'&&t.closest('.modal')&&['nn-name','nn-ini'].includes(t.id)){e.preventDefault();createNote()}
});
document.addEventListener('focusin',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#grid')&&t.dataset.f){
    if(t.dataset.f==='pct'||t.dataset.f==='phase')t.select();
    if(t.dataset.f==='mat'){
      const {r}=cur();const row=r.rows.find(w=>w.id===t.closest('tr').dataset.row);
      if(row&&!row.matId&&t.value.trim())acShow(t,{type:'row',rowId:row.id});
    }
  }
});
document.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.id==='f-mat')acHide();
  if(t.closest&&t.closest('#grid')&&t.dataset.f)gridFocusOut(t);
});
document.addEventListener('paste',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#grid')&&t.dataset.f){gridPaste(e,t);if(e.defaultPrevented)return}
  const files=e.clipboardData&&e.clipboardData.files;
  if(files&&files.length&&ui.view==='note'&&!MR.innerHTML){e.preventDefault();addFiles(files)}
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  const d=e.target.closest&&e.target.closest('#drop');if(!d)return;
  e.preventDefault();
  if(ev==='dragover')d.classList.add('over');else d.classList.remove('over');
  if(ev==='drop')addFiles(e.dataTransfer.files);
}));
$('#reset-demo').addEventListener('click',e=>{
  e.preventDefault();
  if(!confirm('작성한 데이터를 모두 지우고 처음 상태로 되돌립니다.'))return;
  localStorage.removeItem(KEY);DB=seed();ui.view='list';ui.filt={text:'',mats:[],client:'',status:'',mine:false,all:true};setupTopbar();render();
});
$$('.side a,.mods a').forEach(a=>a.addEventListener('click',e=>{if(a.getAttribute('href')==='#')e.preventDefault()}));

setupTopbar();
render();
})();
</script>
</body>
</html>
